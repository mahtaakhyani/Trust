<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Brain Map</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a12;
    font-family: 'Georgia', serif;
    color: #e8e0d0;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }
  canvas { position: absolute; top: 0; left: 0; }
  #ui {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }
  #title {
    position: absolute;
    top: 18px; left: 50%;
    transform: translateX(-50%);
    font-size: 13px;
    letter-spacing: 3px;
    color: #a09080;
    text-transform: uppercase;
  }
  #tooltip {
    position: absolute;
    background: rgba(10,10,18,0.92);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px;
    padding: 12px 16px;
    max-width: 240px;
    font-size: 12.5px;
    line-height: 1.7;
    color: #ddd;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
    z-index: 10;
  }
  #tooltip .tname {
    font-size: 13.5px;
    font-weight: bold;
    margin-bottom: 4px;
    letter-spacing: 0.5px;
  }
  #legend {
    position: absolute;
    bottom: 20px; left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 20px;
    font-size: 11px;
    color: #887;
    letter-spacing: 1px;
  }
  .leg { display: flex; align-items: center; gap: 6px; }
  .leg-line {
    width: 28px; height: 2px;
    border-radius: 2px;
  }
  #hint {
    position: absolute;
    bottom: 50px; left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    color: #554;
    letter-spacing: 1.5px;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="title">Your Neural Architecture</div>
  <div id="hint">HOVER REGIONS · WATCH SIGNALS TRAVEL</div>
  <div id="legend">
    <div class="leg"><div class="leg-line" style="background:#c06080"></div>Synesthetic pathway</div>
    <div class="leg"><div class="leg-line" style="background:#5090c0"></div>Cross-modal encoding</div>
    <div class="leg"><div class="leg-line" style="background:#80c090"></div>Somatic anchor</div>
    <div class="leg"><div class="leg-line" style="background:#c0a040"></div>Attention / executive</div>
  </div>
</div>
<div id="tooltip"><div class="tname" id="tt-name"></div><div id="tt-desc"></div></div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, cx, cy, scale;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cx = W / 2; cy = H / 2;
  scale = Math.min(W, H) / 700;
}
window.addEventListener('resize', resize);

// --- Regions ---
const regions = [
  {
    id: 'S1', name: 'Somatosensory Cortex (S1)',
    desc: 'Your primary anchor. Near-errorless tactile encoding. Fires when you see a wrench — converting visual input into felt grip width. The loudest voice in your neural parliament.',
    rx: 0, ry: -0.28,
    r: 44, color: '#80c090', glow: '#80c090',
    weight: 3.2
  },
  {
    id: 'V4', name: 'V4 — Color Region',
    desc: 'Activates when you think of Tuesday or September — no color physically present. This is your synesthesia engine. Also responds to number personalities and day-of-week positions.',
    rx: -0.32, ry: -0.10,
    r: 36, color: '#c06080', glow: '#e080a0',
    weight: 2.8
  },
  {
    id: 'IPS', name: 'Intraparietal Sulcus (IPS)',
    desc: 'Bridges vision and haptic planning. When you see an object, IPS immediately simulates its grip. This is where your tactile-visual transcoding begins — the converter that turns sight into touch-memory.',
    rx: 0.22, ry: -0.20,
    r: 38, color: '#5090c0', glow: '#70b0e0',
    weight: 2.5
  },
  {
    id: 'PPC', name: 'Posterior Parietal Cortex',
    desc: 'Your multimodal integration hub. Unusually permeable here — the "walls" between senses are thin. Where your spatial calendar lives, always north, always the same address. Where August has a location before it has a name.',
    rx: 0.28, ry: 0.08,
    r: 40, color: '#c06080', glow: '#c06080',
    weight: 2.9
  },
  {
    id: 'ANG', name: 'Angular Gyrus',
    desc: 'Where sequence, meaning, number and space converge. Responsible for your number-form ellipse, the personalities of numbers, the colors of months. High white matter connectivity here explains multiple simultaneous synesthesias.',
    rx: 0.20, ry: 0.26,
    r: 36, color: '#c06080', glow: '#e08090',
    weight: 2.6
  },
  {
    id: 'AMY', name: 'Amygdala',
    desc: 'Your threat detector — hyperreactive to 2–4 kHz (human alarm frequencies). Receives auditory input before conscious processing. Interprets high-frequency transients as threats before you decide they are music.',
    rx: -0.10, ry: 0.20,
    r: 30, color: '#c08040', glow: '#e0a060',
    weight: 2.2
  },
  {
    id: 'A1', name: 'Auditory Cortex (A1)',
    desc: 'Your most attention-dependent region. Drops out when prefrontal focus wavers. When you lose mindfulness, this is the first light to go dark — sounds stop being felt, only abstractly noted, then not noticed at all.',
    rx: -0.30, ry: 0.15,
    r: 33, color: '#c0a040', glow: '#d0b050',
    weight: 1.8
  },
  {
    id: 'PFC', name: 'Prefrontal Cortex',
    desc: 'The executive — your most inconsistent region due to ADHD. When it dims, auditory processing collapses, filtering weakens, sensory overwhelm increases. The auditory anchor in mindfulness is an ignition key for this region.',
    rx: -0.18, ry: -0.38,
    r: 38, color: '#c0a040', glow: '#c0a040',
    weight: 1.6
  },
  {
    id: 'HIPP', name: 'Hippocampus',
    desc: 'Episodic memory encoder — not mature until ~age 3, explaining infantile amnesia. But somatic memories bypass this entirely, encoded in body and amygdala. The cold metal, the fear, the distance of your father — stored elsewhere, retrieved fully.',
    rx: 0.05, ry: 0.35,
    r: 32, color: '#5090c0', glow: '#70a0c0',
    weight: 2.0
  },
  {
    id: 'INS', name: 'Insula',
    desc: 'The interoceptive core — maps your body\'s internal state into felt experience. Responsible for the "body scan" feeling in mindfulness. Unusually active in HSP brains. Where your somatic memory of the fetal position lives as a felt state.',
    rx: -0.05, ry: 0.10,
    r: 34, color: '#80c090', glow: '#90d0a0',
    weight: 2.7
  },
];

function rgba(hex, a) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

// --- Connections ---
const connections = [
  // Synesthetic pathways (red-pink)
  { a: 'V4', b: 'ANG', type: 'syn', strength: 0.95 },
  { a: 'V4', b: 'PPC', type: 'syn', strength: 0.85 },
  { a: 'ANG', b: 'PPC', type: 'syn', strength: 0.90 },

  // Cross-modal encoding (blue)
  { a: 'S1', b: 'IPS', type: 'cross', strength: 1.0 },
  { a: 'IPS', b: 'PPC', type: 'cross', strength: 0.90 },
  { a: 'S1', b: 'INS', type: 'cross', strength: 0.88 },
  { a: 'IPS', b: 'V4', type: 'cross', strength: 0.75 },
  { a: 'S1', b: 'HIPP', type: 'cross', strength: 0.70 },
  { a: 'INS', b: 'HIPP', type: 'cross', strength: 0.72 },

  // Somatic anchor (green)
  { a: 'INS', b: 'AMY', type: 'soma', strength: 0.85 },
  { a: 'S1', b: 'AMY', type: 'soma', strength: 0.78 },
  { a: 'INS', b: 'PFC', type: 'soma', strength: 0.65 },

  // Attention/executive (gold)
  { a: 'PFC', b: 'A1', type: 'exec', strength: 0.80 },
  { a: 'PFC', b: 'AMY', type: 'exec', strength: 0.70 },
  { a: 'PFC', b: 'S1', type: 'exec', strength: 0.55 },
  { a: 'A1', b: 'AMY', type: 'exec', strength: 0.85 },
  { a: 'ANG', b: 'HIPP', type: 'exec', strength: 0.68 },
];

const typeColors = {
  syn:   '#c06080',
  cross: '#5090c0',
  soma:  '#80c090',
  exec:  '#c0a040',
};

// Animated signals
let signals = [];
let lastSignalTime = 0;

function getPos(region) {
  const bx = cx, by = cy + scale * 10;
  const radius = Math.min(W, H) * 0.30;
  return {
    x: bx + region.rx * radius * (W > H ? 1 : W/H * 1.1),
    y: by + region.ry * radius
  };
}

function spawnSignal() {
  const conn = connections[Math.floor(Math.random() * connections.length)];
  const ra = regions.find(r => r.id === conn.a);
  const rb = regions.find(r => r.id === conn.b);
  if (!ra || !rb) return;
  const pa = getPos(ra), pb = getPos(rb);
  const swap = Math.random() > 0.5;
  signals.push({
    x0: swap ? pb.x : pa.x, y0: swap ? pb.y : pa.y,
    x1: swap ? pa.x : pb.x, y1: swap ? pa.y : pb.y,
    t: 0, speed: 0.008 + Math.random() * 0.012,
    color: typeColors[conn.type],
    size: 2.5 + conn.strength * 2,
    trail: [],
    conn
  });
}

let hovered = null;
canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  hovered = null;
  for (const r of regions) {
    const p = getPos(r);
    const dist = Math.hypot(mx - p.x, my - p.y);
    if (dist < r.r * scale) { hovered = r; break; }
  }
  const tt = document.getElementById('tooltip');
  if (hovered) {
    document.getElementById('tt-name').textContent = hovered.name;
    document.getElementById('tt-desc').textContent = hovered.desc;
    tt.style.opacity = '1';
    let tx = e.clientX + 18, ty = e.clientY - 10;
    if (tx + 260 > W) tx = e.clientX - 270;
    if (ty + 160 > H) ty = H - 170;
    tt.style.left = tx + 'px';
    tt.style.top = ty + 'px';
  } else {
    tt.style.opacity = '0';
  }
});

function drawBrainOutline() {
  const bx = cx, by = cy + scale * 10;
  const rx = scale * 155, ry = scale * 130;
  ctx.save();
  // outer glow
  const g = ctx.createRadialGradient(bx, by - ry*0.1, ry*0.2, bx, by - ry*0.1, rx*1.1);
  g.addColorStop(0, 'rgba(80,60,120,0.18)');
  g.addColorStop(1, 'rgba(80,60,120,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.ellipse(bx, by - ry*0.1, rx*1.15, ry*1.15, 0, 0, Math.PI*2);
  ctx.fill();

  // brain shape - simplified with bezier
  ctx.beginPath();
  ctx.strokeStyle = 'rgba(160,130,180,0.18)';
  ctx.lineWidth = 1.5;
  // roughly brain-shaped ellipse with bump
  ctx.ellipse(bx, by - scale*10, rx, ry, 0, 0, Math.PI*2);
  ctx.stroke();

  // sulci hints
  ctx.strokeStyle = 'rgba(160,130,180,0.08)';
  ctx.lineWidth = 1;
  for (let i = 0; i < 5; i++) {
    const angle = (i / 5) * Math.PI - Math.PI/2;
    const sr = ry * (0.3 + Math.random() * 0.4);
    ctx.beginPath();
    ctx.arc(bx + Math.cos(angle)*rx*0.3, by - scale*10 + Math.sin(angle)*ry*0.3,
      sr * 0.5, angle - 0.8, angle + 0.8);
    ctx.stroke();
  }
  ctx.restore();
}

function drawConnections() {
  for (const conn of connections) {
    const ra = regions.find(r => r.id === conn.a);
    const rb = regions.find(r => r.id === conn.b);
    if (!ra || !rb) continue;
    const pa = getPos(ra), pb = getPos(rb);
    const isActive = hovered && (hovered.id === conn.a || hovered.id === conn.b);
    const alpha = isActive ? 0.55 : 0.18;
    const lw = isActive ? conn.strength * 3.5 : conn.strength * 1.5;
    ctx.beginPath();
    ctx.strokeStyle = rgba(typeColors[conn.type], alpha);
    ctx.lineWidth = lw * scale;
    // slight curve
    const mx2 = (pa.x + pb.x) / 2 + (pb.y - pa.y) * 0.15;
    const my2 = (pa.y + pb.y) / 2 - (pb.x - pa.x) * 0.15;
    ctx.moveTo(pa.x, pa.y);
    ctx.quadraticCurveTo(mx2, my2, pb.x, pb.y);
    ctx.stroke();
  }
}

function drawSignals(dt) {
  for (let i = signals.length - 1; i >= 0; i--) {
    const s = signals[i];
    s.t += s.speed;
    const t = s.t;
    const x = s.x0 + (s.x1 - s.x0) * t;
    const y = s.y0 + (s.y1 - s.y0) * t;
    s.trail.push({ x, y, t });
    if (s.trail.length > 18) s.trail.shift();

    // draw trail
    for (let j = 1; j < s.trail.length; j++) {
      const ta = s.trail[j-1], tb = s.trail[j];
      const alpha = (j / s.trail.length) * 0.7;
      ctx.beginPath();
      ctx.strokeStyle = rgba(s.color, alpha);
      ctx.lineWidth = (s.size * (j / s.trail.length)) * scale;
      ctx.moveTo(ta.x, ta.y);
      ctx.lineTo(tb.x, tb.y);
      ctx.stroke();
    }

    // draw head
    const headGlow = ctx.createRadialGradient(x, y, 0, x, y, s.size * 2.5 * scale);
    headGlow.addColorStop(0, rgba(s.color, 0.9));
    headGlow.addColorStop(1, rgba(s.color, 0));
    ctx.beginPath();
    ctx.fillStyle = headGlow;
    ctx.arc(x, y, s.size * 2.5 * scale, 0, Math.PI * 2);
    ctx.fill();

    if (s.t >= 1) signals.splice(i, 1);
  }
}

function drawRegions() {
  for (const r of regions) {
    const p = getPos(r);
    const rs = r.r * scale;
    const isHov = hovered && hovered.id === r.id;

    // glow
    const glowR = isHov ? rs * 2.8 : rs * 2.0;
    const glow = ctx.createRadialGradient(p.x, p.y, rs * 0.2, p.x, p.y, glowR);
    glow.addColorStop(0, rgba(r.glow, isHov ? 0.45 : 0.22));
    glow.addColorStop(1, rgba(r.glow, 0));
    ctx.beginPath();
    ctx.fillStyle = glow;
    ctx.arc(p.x, p.y, glowR, 0, Math.PI * 2);
    ctx.fill();

    // body
    const bodyG = ctx.createRadialGradient(p.x - rs*0.25, p.y - rs*0.25, rs*0.1, p.x, p.y, rs);
    bodyG.addColorStop(0, rgba(r.color, isHov ? 0.95 : 0.75));
    bodyG.addColorStop(0.6, rgba(r.color, isHov ? 0.70 : 0.45));
    bodyG.addColorStop(1, rgba(r.color, 0.1));
    ctx.beginPath();
    ctx.fillStyle = bodyG;
    ctx.arc(p.x, p.y, rs, 0, Math.PI * 2);
    ctx.fill();

    // border
    ctx.beginPath();
    ctx.strokeStyle = rgba(r.color, isHov ? 0.9 : 0.4);
    ctx.lineWidth = (isHov ? 2 : 1) * scale;
    ctx.arc(p.x, p.y, rs, 0, Math.PI * 2);
    ctx.stroke();

    // label
    ctx.fillStyle = isHov ? '#fff' : 'rgba(220,210,200,0.85)';
    ctx.font = `${isHov ? 'bold ' : ''}${Math.round(10 * scale)}px Georgia`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(r.id, p.x, p.y);
  }
}

let last = 0;
function loop(ts) {
  const dt = ts - last; last = ts;
  ctx.clearRect(0, 0, W, H);

  // background
  const bg = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W,H)*0.7);
  bg.addColorStop(0, '#0e0e1a');
  bg.addColorStop(1, '#060608');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  drawBrainOutline();
  drawConnections();
  drawSignals(dt);
  drawRegions();

  // spawn signals
  if (ts - lastSignalTime > 220 && signals.length < 12) {
    spawnSignal();
    lastSignalTime = ts;
  }

  requestAnimationFrame(loop);
}

resize();
requestAnimationFrame(loop);
</script>
</body>
</html>
